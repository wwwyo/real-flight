<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REAL FLIGHT Targets</title>
    <style>
      body {
        margin: 0;
        font: 16px system-ui, sans-serif;
        background: #fff;
        color: #000;
      }
      p {
        margin: 16px;
      }
      figure {
        margin: 0;
        padding: 10mm;
        break-after: page;
        text-align: center;
      }
      figure svg {
        width: 150mm;
        height: 150mm;
      }
      /* The 150 mm marker is sized for A4; a printer left on Letter crops or rescales it. */
      @page {
        size: A4;
      }
      @media print {
        p {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <p>1 ページに標的 1 枚ずつ、倍率 100% で印刷してください。マーカーのまわりの白い余白は切り落とさないでください。</p>
    <main id="targets"></main>
    <script type="module" src="./markers.ts"></script>
  </body>
</html>
