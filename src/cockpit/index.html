<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REAL FLIGHT Cockpit</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #7dff9a;
        font: 14px ui-monospace, Menlo, "Hiragino Sans", monospace;
      }
      body {
        display: grid;
        place-items: center;
      }
      #view {
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 4 / 3;
      }
      #help {
        position: fixed;
        left: 12px;
        bottom: 12px;
        max-width: calc(50vw - 100px);
        font-size: 12px;
        opacity: 0.7;
      }
      #error {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        color: #ff5a5a;
      }
    </style>
  </head>
  <body>
    <canvas id="view" width="960" height="720"></canvas>
    <div id="help">
      キー: W/S 上昇・下降 · A/D 旋回 · 矢印 前後左右 · F 射撃 · T 離陸 · L 着陸 · Space 非常停止
      <br />Touch: 左スティック 上昇・下降と旋回 · 右スティック 前後左右 · トリガー 射撃 · A 離陸 · B 着陸 · X 非常停止
    </div>
    <div id="error" role="alert"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
